<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a12">
<meta name="color-scheme" content="dark">
<title>激活 · MooTrader</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  :root{--bg:#070a12;--card:rgba(17,23,38,.82);--primary:#58a6ff;--txt:#e6edf3;--muted:#8b96a8;--border:#232c40}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;
       background:
         radial-gradient(900px 480px at 50% -12%, rgba(31,111,235,.22), transparent 62%),
         radial-gradient(700px 420px at 90% 110%, rgba(163,113,247,.14), transparent 60%),
         var(--bg);
       font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--txt)}
  .box{width:380px;max-width:90vw;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 45%),var(--card);
       border:1px solid var(--border);border-radius:18px;padding:30px 26px;
       box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
       backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
  .logo{font-weight:800;font-size:22px;margin-bottom:4px;letter-spacing:.2px}
  .logo b{background:linear-gradient(120deg,#58a6ff,#a371f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);
        background:rgba(7,11,20,.7);color:var(--txt);font-size:15px;outline:none;-webkit-appearance:none;
        font-family:ui-monospace,Menlo,monospace;letter-spacing:.4px;
        transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(88,166,255,.16)}
  button{width:100%;margin-top:14px;padding:12px;border:1px solid rgba(88,166,255,.5);border-radius:11px;
         background:linear-gradient(180deg,#2f81f7,#1f6feb);color:#fff;font-size:15px;font-weight:600;cursor:pointer;
         box-shadow:0 4px 16px -4px rgba(31,111,235,.6)}
  button:active{opacity:.85}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--muted);border-color:var(--border);box-shadow:none;font-weight:500}
  .err{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:18px}
  .ok{color:#3fb950}
  .info{font-size:13px;color:var(--muted);line-height:1.8;margin-top:6px;
        border:1px solid var(--border);border-radius:11px;padding:12px 14px;background:rgba(7,11,20,.45)}
  .info b{color:var(--txt);font-weight:600}
  .buy{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--primary);text-decoration:none}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Moo<b>Trader</b></div>
    <div class="sub">输入 License Key 激活本机</div>

    <form id="formAct" onsubmit="return doActivate(event)">
      <input id="key" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX" autofocus
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit" id="btnAct">激活 Activate</button>
      <a class="buy hidden" id="buyLink" target="_blank" rel="noopener">还没有 key？订阅购买（RM50/月）→</a>
    </form>

    <div id="actState" class="hidden">
      <div class="info" id="licInfo">—</div>
      <button type="button" onclick="location.href='/'">进入面板 →</button>
      <button type="button" class="ghost" id="btnDeact" onclick="doDeactivate()">解绑此机器（换机用）</button>
    </div>

    <div class="err" id="err"></div>
  </div>
<script>
// TODO(release): set this to your Lemon Squeezy checkout URL to show a buy link.
const BUY_URL = "";

const $ = id => document.getElementById(id);
if (BUY_URL) { $('buyLink').href = BUY_URL; $('buyLink').classList.remove('hidden'); }

function fmtTs(t){ return t ? new Date(t*1000).toLocaleString() : '—'; }

async function loadStatus(){
  try{
    const d = await (await fetch('/api/license/status')).json();
    if (!d.enforced){
      $('err').innerHTML = '<span class="ok">开发模式：当前未强制 license（MMT_LICENSE_ENFORCED=0）</span>';
    }
    if (d.activated){
      $('formAct').classList.add('hidden');
      $('actState').classList.remove('hidden');
      $('licInfo').innerHTML =
        `${d.valid ? '<span class="ok">✅ 订阅有效</span>' : '⚠️ 订阅已失效'}${d.valid && d.msg && d.msg !== 'ok' ? ' · ' + d.msg : ''}<br>` +
        `Key：<b>${d.key_masked || '—'}</b><br>` +
        (d.email ? `账户：<b>${d.email}</b><br>` : '') +
        `本机：<b>${d.machine || '—'}</b><br>` +
        (d.expires_at ? `本期至：<b>${fmtTs(d.expires_at)}</b>（续费自动延期）<br>` : '') +
        `激活于：${fmtTs(d.activated_at)} · 上次验证：${fmtTs(d.last_ok)}` +
        (d.valid ? '' : `<br><span style="color:#ff6b6b">${d.msg || ''}</span>`);
    }
  }catch(_){}
}

async function doActivate(e){
  e.preventDefault();
  const err = $('err'); err.textContent = '';
  const key = $('key').value.trim();
  if (!key){ err.textContent = '请输入 license key'; return false; }
  $('btnAct').disabled = true; $('btnAct').textContent = '激活中…';
  try{
    const r = await fetch('/api/license/activate', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({key})});
    const d = await r.json();
    if (r.ok && d.ok){ location.href = '/'; return false; }
    err.textContent = d.error || '激活失败';
  }catch(_){ err.textContent = '连接失败，请检查网络'; }
  $('btnAct').disabled = false; $('btnAct').textContent = '激活 Activate';
  return false;
}

async function doDeactivate(){
  if (!confirm('确定解绑本机？解绑后此机器将无法使用，key 可在新机器上重新激活。')) return;
  const err = $('err'); err.textContent = '';
  try{
    const r = await fetch('/api/license/deactivate', {method:'POST'});
    const d = await r.json();
    if (r.ok && d.ok){
      $('actState').classList.add('hidden');
      $('formAct').classList.remove('hidden');
      err.innerHTML = '<span class="ok">已解绑，可在新机器上激活。</span>';
      return;
    }
    err.textContent = d.error || (r.status === 401 ? '需要先登录面板（输入访问密码）才能解绑' : '解绑失败');
  }catch(_){ err.textContent = '连接失败'; }
}

loadStatus();
</script>
</body>
</html>
