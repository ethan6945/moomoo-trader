<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a12">
<meta name="color-scheme" content="dark">
<title>登录 · MooTrader</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  :root{--bg:#070a12;--card:rgba(17,23,38,.82);--primary:#58a6ff;--txt:#e6edf3;--muted:#8b96a8;--border:#232c40}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;
       background:
         radial-gradient(900px 480px at 50% -12%, rgba(31,111,235,.22), transparent 62%),
         radial-gradient(700px 420px at 90% 110%, rgba(163,113,247,.14), transparent 60%),
         var(--bg);
       font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--txt)}
  .box{width:330px;max-width:88vw;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 45%),var(--card);
       border:1px solid var(--border);border-radius:18px;padding:30px 26px;
       box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
       backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
  .logo{font-weight:800;font-size:22px;margin-bottom:4px;letter-spacing:.2px}
  .logo b{background:linear-gradient(120deg,#58a6ff,#a371f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);
        background:rgba(7,11,20,.7);color:var(--txt);font-size:16px;outline:none;-webkit-appearance:none;
        transition:border-color .15s,box-shadow .15s}
  input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(88,166,255,.16)}
  button{width:100%;margin-top:14px;padding:12px;border:1px solid rgba(88,166,255,.5);border-radius:11px;
         background:linear-gradient(180deg,#2f81f7,#1f6feb);color:#fff;font-size:15px;font-weight:600;cursor:pointer;
         box-shadow:0 4px 16px -4px rgba(31,111,235,.6)}
  button:active{opacity:.85}
  .err{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
  <form class="box" onsubmit="return go(event)">
    <div class="logo">Moo<b>Trader</b></div>
    <div class="sub">请输入访问密码</div>
    <input id="pw" type="password" placeholder="密码" autofocus autocomplete="current-password">
    <button type="submit">登录</button>
    <div class="err" id="err"></div>
  </form>
<script>
async function go(e){
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  const pw=document.getElementById('pw').value;
  try{
    const r=await fetch('/api/login',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(r.ok){location.href='/';}
    else{err.textContent='密码错误';}
  }catch(_){ err.textContent='连接失败'; }
  return false;
}
</script>
</body>
</html>
