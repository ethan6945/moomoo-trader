<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<meta name="color-scheme" content="dark">
<title>登录 · MooMooTrader</title>
<style>
  :root{--bg:#0a0d14;--card:#121722;--primary:#4d9dff;--txt:#e6edf3;--muted:#8b98a9;--border:#222a38}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;
       background:radial-gradient(1200px 600px at 50% -10%,#16203a,var(--bg));
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;color:var(--txt)}
  .box{width:320px;max-width:88vw;background:var(--card);border:1px solid var(--border);
       border-radius:16px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{font-weight:800;font-size:21px;margin-bottom:4px}
  .logo b{color:var(--primary)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
        background:#0d1119;color:var(--txt);font-size:16px;outline:none;-webkit-appearance:none}
  input:focus{border-color:var(--primary)}
  button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;
         background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:active{opacity:.85}
  .err{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
  <form class="box" onsubmit="return go(event)">
    <div class="logo">MooMoo<b>Trader</b></div>
    <div class="sub">请输入访问密码</div>
    <input id="pw" type="password" placeholder="密码" autofocus autocomplete="current-password">
    <button type="submit">登录</button>
    <div class="err" id="err"></div>
  </form>
<script>
async function go(e){
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  const pw=document.getElementById('pw').value;
  try{
    const r=await fetch('/api/login',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(r.ok){location.href='/';}
    else{err.textContent='密码错误';}
  }catch(_){ err.textContent='连接失败'; }
  return false;
}
</script>
</body>
</html>
